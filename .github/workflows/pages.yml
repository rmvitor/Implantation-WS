name: Publicar Implanta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: implanta-test-only
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:db
        env:
          IMPLANTA_TEST_DATABASE_URL: postgres://postgres:implanta-test-only@127.0.0.1:5432/postgres
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Aguardar publicação antiga do Pages, quando habilitada
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pages } = await github.rest.repos.getPages({ owner, repo });
            if (pages.build_type !== 'legacy') return;

            // A branch-based Pages build can publish raw Vite source after this
            // workflow. Wait for those builds before deploying our dist artifact.
            // Selecting GitHub Actions in Settings > Pages removes this extra build.
            await new Promise(resolve => setTimeout(resolve, 15000));
            for (let attempt = 0; attempt < 40; attempt++) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, branch: pages.source?.branch || 'main', per_page: 100,
              });
              const pending = runs.filter(run =>
                run.name === 'pages build and deployment' && run.status !== 'completed'
              );
              if (pending.length === 0) return;
              core.info(`Aguardando ${pending.length} publicação(ões) automática(s) do Pages.`);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('A publicação antiga do Pages ainda está em execução. Reexecute este workflow após ela terminar.');
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
